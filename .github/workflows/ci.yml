# ============================================================
# CI - Validação automatizada do projeto
# ============================================================
#
# Este workflow executa verificações básicas de qualidade a cada push
# na branch main e a cada pull request.
#
# Validações executadas:
# - instalação das dependências do projeto;
# - verificação de estilo com Ruff;
# - execução dos testes automatizados com Pytest.
#
# O objetivo é garantir que alterações no código não quebrem os testes
# nem introduzam problemas básicos de qualidade antes da versão v1.0 Portfolio.
# ============================================================

name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    name: Lint and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff
        run: |
          ruff check src tests

      - name: Run tests
        run: |
          pytest